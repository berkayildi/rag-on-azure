[mypy]
# Cross-package source roots so mypy can resolve imports between
# app/ (rag_on_azure) and ingest/ (ingest) — they're editable-installed
# in the dev venv but pre-commit's isolated mypy env doesn't see the
# editable install. mypy_path makes mypy walk these directories
# directly when resolving imports.
mypy_path = app/src, ingest/src
