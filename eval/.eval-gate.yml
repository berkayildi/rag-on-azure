# Quality gate for the rag-on-azure eval workflow.
#
# Schema is mcp-llm-eval v0.9.2's loader (see mcp_llm_eval/config.py). The
# corpus JSONL is produced by ./snapshot_corpus.py against the deployed dev
# index and passed via --corpus on the CLI; --dataset and --model are also
# passed on the CLI. This file owns models (required), judge, output_dir, and
# thresholds.

models:
  - provider: openai
    model: gpt-4o-mini
    max_tokens: 1024
    input_cost_per_mtok: 0.15
    output_cost_per_mtok: 0.60

judge:
  provider: openai
  model: gpt-4o-mini
  temperature: 0

output_dir: eval/.results

# Initial thresholds are conservative for a v1 corpus: values likely to be
# achievable on the seeded FCA/HMRC documents with BM25 + gpt-4o-mini. Tighten
# (or split per-category) once we have a few CI runs of baseline numbers.
thresholds:
  # Retrieval quality (k=5 by CLI default).
  # Calibrated against run 25584786057 (first real eval-gate exercise on
  # main, 2026-05-08): recall@5 0.7778, mrr 0.5278, ndcg@5 0.5908,
  # precision@5 0.1556 (= recall/k — see note below).
  avg_recall_at_k: 0.60
  # avg_precision_at_k removed: every golden row currently has exactly
  # one relevant_chunk_id, so max possible avg_precision_at_5 = 1/5 =
  # 0.20 by construction. The metric collapses to recall_at_5 / 5 in
  # this dataset shape and adds no signal beyond avg_recall_at_k. Add
  # back with a real threshold when goldens grow to multi-chunk
  # relevance judgements.
  avg_mrr: 0.50
  avg_ndcg_at_k: 0.55
  p95_retrieval_latency_ms: 200

  # RAG quality (judge: gpt-4o-mini).
  # Calibrated against run 25584786057: context_relevance 0.7097,
  # citation_faithfulness 0.9931. Citation_faithfulness threshold
  # tightened from 0.70 to 0.90 to actually exercise the metric
  # (gpt-4o-mini hallucinates rarely on this corpus).
  avg_context_relevance: 0.55
  avg_citation_faithfulness: 0.90

  # Generation latency / cost
  p95_ttft_ms: 5000
  max_cost_per_query: 0.005
