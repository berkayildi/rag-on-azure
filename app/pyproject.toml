[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-on-azure"
version = "0.0.0"
description = "FastAPI + LangGraph RAG application for rag-on-azure"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Berkay Yildirim" }]
# Dependency scope grows with each phase. The canonical adapter slice
# (LLMClient, TenantAwareSearchClient) needs azure-* + openai + pydantic.
# Day 5 Phase A lands the API contract + auth dependency, which pulls in
# fastapi and pyjwt. LangGraph lands with the graph nodes in Phase B.
# See docs/design/rag-on-azure.md §3.
dependencies = [
    "azure-identity>=1.18,<2",
    "azure-search-documents>=11.5,<12",
    # aiohttp is the runtime async transport for azure-identity.aio and
    # azure-search-documents.aio. Gated behind their [aio] extras in their
    # packaging but required at instantiation time. See AGENTS.md.
    "aiohttp>=3.10,<4",
    "openai>=1.50,<2",
    "pydantic>=2.9,<3",
    "tenacity>=9.0,<10",
    "fastapi>=0.115,<1",
    "pyjwt>=2.9,<3",
    "langgraph>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_on_azure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
