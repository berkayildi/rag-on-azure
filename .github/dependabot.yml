version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "app"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      app-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      app-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/ingest"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "ingest"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      ingest-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      ingest-security:
        applies-to: security-updates
        patterns:
          - "*"
