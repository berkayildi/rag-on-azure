name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            app/pyproject.toml
            ingest/pyproject.toml
      - name: Install packages
        run: pip install -e "./app[dev]" -e "./ingest[dev]"
      - name: Run ruff + mypy
        run: make lint

  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Pin to the same version as the pre-commit hook
        # (.pre-commit-config.yaml) so CI and local pre-commit don't drift.
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose

  bicep-validate:
    name: Bicep build (infra lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bicep
        run: az bicep install
      - name: Validate every .bicep file
        run: make validate

  unit-tests:
    name: Unit tests (app + ingest)
    runs-on: ubuntu-latest
    needs: [lint, gitleaks, bicep-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            app/pyproject.toml
            ingest/pyproject.toml
      - name: Install packages
        run: pip install -e "./app[dev]" -e "./ingest[dev]"
      - name: Run unit tests
        # Two invocations, not one. A single `pytest app/tests/unit ingest/tests/unit`
        # collides because both trees have a conftest.py at tests/unit/, and
        # pytest's default `prepend` import mode imports both as the same
        # `tests.unit.conftest` module name → ImportPathMismatchError. Splitting
        # keeps each invocation's rootdir scoped to one package.
        run: pytest app/tests/unit -q && pytest ingest/tests/unit -q

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, gitleaks, bicep-validate]
    # TODO(spec §6.1 stage 3): swap the in-process fakes for Azurite + a
    # fake Azure AI Search container via docker-compose when the
    # integration suite grows past what dependency_overrides can express.
    # Today's tests use TestClient + FakeSearchClient + FakeLLMClient
    # wired through app/tests/conftest.py — no external services.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            app/pyproject.toml
            ingest/pyproject.toml
      - name: Install packages
        run: pip install -e "./app[dev]" -e "./ingest[dev]"
      - name: Run integration tests
        run: pytest app/tests/integration -q

  build:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rag-on-azure
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest-dev,enable={{is_default_branch}}
      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
