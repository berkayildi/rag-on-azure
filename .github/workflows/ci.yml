name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            app/pyproject.toml
            ingest/pyproject.toml
      - name: Install packages
        run: pip install -e "./app[dev]" -e "./ingest[dev]"
      - name: Run ruff + mypy
        run: make lint

  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Pin to the same version as the pre-commit hook
        # (.pre-commit-config.yaml) so CI and local pre-commit don't drift.
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose

  bicep-validate:
    name: Bicep build (infra lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bicep
        run: az bicep install
      - name: Validate every .bicep file
        run: make validate

  unit-tests:
    name: Unit tests (app + ingest)
    runs-on: ubuntu-latest
    needs: [lint, gitleaks, bicep-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            app/pyproject.toml
            ingest/pyproject.toml
      - name: Install packages
        run: pip install -e "./app[dev]" -e "./ingest[dev]"
      - name: Run unit tests
        # Two invocations, not one. A single `pytest app/tests/unit ingest/tests/unit`
        # collides because both trees have a conftest.py at tests/unit/, and
        # pytest's default `prepend` import mode imports both as the same
        # `tests.unit.conftest` module name → ImportPathMismatchError. Splitting
        # keeps each invocation's rootdir scoped to one package.
        run: pytest app/tests/unit -q && pytest ingest/tests/unit -q

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, gitleaks, bicep-validate]
    # TODO(spec §6.1 stage 3): swap the in-process fakes for Azurite + a
    # fake Azure AI Search container via docker-compose when the
    # integration suite grows past what dependency_overrides can express.
    # Today's tests use TestClient + FakeSearchClient + FakeLLMClient
    # wired through app/tests/conftest.py — no external services.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            app/pyproject.toml
            ingest/pyproject.toml
      - name: Install packages
        run: pip install -e "./app[dev]" -e "./ingest[dev]"
      - name: Run integration tests
        run: pytest app/tests/integration -q

  build:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rag-on-azure
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest-dev,enable={{is_default_branch}}
      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bicep-whatif:
    name: Bicep what-if (dev RG)
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install bicep
        run: az bicep install
      - name: What-if against dev RG
        # Uses the committed example file as the static base; overrides
        # location (avoids drift if the example's hardcoded value diverges
        # from the AZURE_LOCATION repo variable) and containerImage (sha-pin
        # per containerapp.bicep:49). developerPrincipalId stays empty —
        # search.bicep:59 and openai.bicep:124 guard with `if (!empty(...))`,
        # so the developer role assignments are skipped in CI as intended.
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.example.json \
            --parameters location="${{ vars.AZURE_LOCATION }}" \
                         containerImage="ghcr.io/${{ github.repository_owner }}/rag-on-azure:sha-${SHA_SHORT}"

  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: [build, bicep-whatif]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install bicep
        run: az bicep install
      - name: Deploy main.bicep with sha-pinned image
        # Same parameter shape as the what-if step above. The deploy uses
        # the immutable sha-<short> tag pushed by the build job, not
        # latest-dev, so each merge produces a reproducible deployment.
        # ciPrincipalId is sourced from a repo variable so the eval-gate
        # job's CI service principal lands a Search Index Data Reader
        # role assignment on first apply (see infra/modules/search.bicep).
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.example.json \
            --parameters location="${{ vars.AZURE_LOCATION }}" \
                         containerImage="ghcr.io/${{ github.repository_owner }}/rag-on-azure:sha-${SHA_SHORT}" \
                         ciPrincipalId="${{ vars.AZURE_CI_PRINCIPAL_ID }}"

  eval-gate:
    name: Eval gate (snapshot + evaluate-rag)
    runs-on: ubuntu-latest
    needs: [deploy]
    # Same trigger gate as deploy — the eval-gate snapshots the live dev
    # index, which only exists after deploy and only updates on main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/pyproject.toml
      - name: Install snapshot deps + mcp-llm-eval
        # azure-search-documents + azure-identity are pulled via ./app for
        # snapshot_corpus.py; mcp-llm-eval ships its own bm25 + openai client.
        run: |
          pip install -e ./app
          pip install 'mcp-llm-eval==0.9.2'
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Discover search endpoint
        id: search
        # Query the live resource (single AI Search service per RG) rather
        # than reading a Bicep deployment output. Robust if deployment name
        # drifts and matches the construction in modules/search.bicep:71.
        run: |
          SEARCH_NAME=$(az search service list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query '[0].name' -o tsv)
          if [ -z "$SEARCH_NAME" ]; then
            echo "No search service found in RG ${{ vars.AZURE_RESOURCE_GROUP }}" >&2
            exit 1
          fi
          echo "endpoint=https://${SEARCH_NAME}.search.windows.net" >> "$GITHUB_OUTPUT"
      - name: Snapshot corpus to JSONL
        run: |
          python eval/snapshot_corpus.py \
            --endpoint "${{ steps.search.outputs.endpoint }}" \
            --tenant demo \
            --output eval/.cache/corpus_snapshot.jsonl
      - name: Run evaluate-rag
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mcp-llm-eval evaluate-rag \
            --dataset eval/golden.jsonl \
            --corpus eval/.cache/corpus_snapshot.jsonl \
            --config eval/.eval-gate.yml \
            --model openai:gpt-4o-mini \
            --output-dir eval/.results
      - name: Upload eval artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: eval/.results/
          retention-days: 30
          # eval/.results/ is dot-prefixed (matches our eval/.cache/ pattern),
          # which actions/upload-artifact@v4 treats as hidden by default and
          # skips. Engine writes the summary + benchmark JSONs there before
          # the threshold check fires, so we want them uploaded regardless of
          # gate pass/fail.
          include-hidden-files: true

  publish-benchmarks:
    name: Publish benchmarks to llm-benchmarks
    runs-on: ubuntu-latest
    needs: [eval-gate]
    # Same main-only push gate as eval-gate, plus the fork toggle: forks
    # without LLMSHOT_PUSH_ENABLED=true skip silently. Job is best-effort
    # (continue-on-error) per the design D5 verdict — eval-gate's contract
    # is that the deployed RAG meets quality thresholds, not that the
    # benchmark data layer is reachable.
    if: |
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && vars.LLMSHOT_PUSH_ENABLED == 'true'
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Mint GitHub App install token (scoped to llm-benchmarks)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LLMSHOT_APP_ID }}
          private-key: ${{ secrets.LLMSHOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: llm-benchmarks
      - name: Download eval-results artefact
        uses: actions/download-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: ./eval-results
      - name: Checkout llm-benchmarks
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/llm-benchmarks
          token: ${{ steps.app-token.outputs.token }}
          path: llm-benchmarks-target
      - name: Place artefacts at expected paths
        # Two pointer files (overwritten each run) plus a timestamped
        # pair under history/ (append-only). Pointer files feed llmshot's
        # "current" view; history feeds drift charts. See design §13.1.
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          TARGET="llm-benchmarks-target/retrieval"
          HIST="$TARGET/history"
          mkdir -p "$HIST"
          LATEST_BENCHMARK=$(ls -t eval-results/*_rag_benchmark.json | head -1)
          if [ -z "$LATEST_BENCHMARK" ]; then
            echo "no rag_benchmark JSON found in eval-results/" >&2
            exit 1
          fi
          cp eval-results/latest_rag_summary.json "$TARGET/azure-summary.json"
          cp "$LATEST_BENCHMARK" "$TARGET/azure-benchmark.json"
          cp eval-results/latest_rag_summary.json \
            "$HIST/azure-${SHA_SHORT}-${TIMESTAMP}-summary.json"
          cp "$LATEST_BENCHMARK" \
            "$HIST/azure-${SHA_SHORT}-${TIMESTAMP}-benchmark.json"
      - name: Commit and push to llm-benchmarks main
        working-directory: llm-benchmarks-target
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retrieval/
          if git diff --cached --quiet; then
            echo "no changes to publish (rare: identical eval results)"
            exit 0
          fi
          git commit -m "chore(azure): bench ${SHA_SHORT} ${TIMESTAMP}"
          git push
